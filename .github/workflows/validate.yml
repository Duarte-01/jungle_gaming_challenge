name: Validate marketplace
on:
  push:
    branches: [main, feat/marketplace-base]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned validation environment
        run: docker build --tag kurio-validation --file ci/Dockerfile ci
      - name: Check, build and test in the same browser environment as the baselines
        run: >-
          docker run --rm --ipc=host --user "$(id -u):$(id -g)"
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/app
          --workdir /app --env npm_config_cache=/tmp/npm-cache --env XDG_CACHE_HOME=/tmp/kurio-cache --env CI=true --env E2E_PREVIEW=true
          kurio-validation sh -c '
          node --version && chromium --version && npm ci &&
          npm run typecheck && npm run lint && npm run format:check &&
          npm run test:unit && npm run build &&
          npm run test:e2e -- --workers=2 --retries=0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Remove reports from previous commits
        run: rm -rf -- reports/lighthouse
      - name: Build the same pinned audit environment
        run: docker build --tag kurio-validation --file ci/Dockerfile ci
      - name: Audit all pages and enforce every Lighthouse target
        run: >-
          docker run --rm --ipc=host --user "$(id -u):$(id -g)"
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/app
          --workdir /app --env npm_config_cache=/tmp/npm-cache --env XDG_CACHE_HOME=/tmp/kurio-cache --env CI=true
          kurio-validation sh -c '
          node --version && chromium --version && npm ci &&
          npm run build && npm run audit:lighthouse'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: reports/lighthouse/
          retention-days: 14
